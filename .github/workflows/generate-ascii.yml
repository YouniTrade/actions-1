name: Generate ascii workflow
#on: push
on:
  workflow_dispatch:
  # schedule:
  #   - cron: "*/1 * * * *"
env:
  JOB: Software Engineer
jobs:
  build-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: run script
        run: |
          chmod +x asci-script.sh
          ./asci-script.sh
          echo ${JOB}
      - name: Upload the dragon.txt file
        uses: actions/upload-artifact@v7
        with:
          name: dragon-artifact
          path: dragon.txt
  test-job:
    env:
      NAME: AL batal
    needs: build-job
    runs-on: ubuntu-latest
    steps:
      - name: download the dragon.txt file
        uses: actions/download-artifact@v7
        with:
          name: dragon-artifact
      - name: run script
        run: |
          grep -i "dragon" dragon.txt
          echo ${{vars.USERNAME}}
          echo ${{ secrets.SOME_RANDOM_PASSWORD }}
  deploy-job:
    needs: test-job
    runs-on: ubuntu-latest
    steps:
      - name: download the dragon.txt file
        uses: actions/download-artifact@v7
        with:
          name: dragon-artifact
      - name: Test if dragon is visible
        env:
          NAME: El Mahfoud Bouatim
        run: |
          cat dragon.txt
          echo ${NAME}
